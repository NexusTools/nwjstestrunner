<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NW.js Test Runner Demo Client</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #181825;
      color: #cdd6f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #demo-app-shell {
      max-width: 720px;
      margin: 0 auto;
      background: #1e1e2e;
      border: 1px solid #313244;
      border-radius: 10px;
      padding: 20px;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="demo-app-shell">
    <h1 id="demo-header">NW.js Demo Client App</h1>
    <p id="demo-counter-display" data-count="0">Count: 0</p>
    <button id="btn-increment" type="button">Increment</button>
    <button id="btn-fetch-api" type="button">Fetch Mock API</button>
    <div id="demo-api-result"></div>
  </div>
  <script>
    (function() {
      let count = 0;
      const display = document.getElementById('demo-counter-display');
      const incBtn = document.getElementById('btn-increment');
      const apiBtn = document.getElementById('btn-fetch-api');
      const apiResult = document.getElementById('demo-api-result');

      window.demoAppState = {
        getCount: function() { return count; },
        setCount: function(v) {
          count = v;
          display.setAttribute('data-count', String(count));
          display.textContent = 'Count: ' + count;
        }
      };

      incBtn.addEventListener('click', function() {
        window.demoAppState.setCount(count + 1);
      });

      apiBtn.addEventListener('click', async function() {
        const res = await fetch('/v1/mock-status');
        const data = await res.json();
        apiResult.textContent = data.status + ':' + data.engine;
      });
    })();
  </script>
</body>
</html>
